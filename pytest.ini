# Tests live in tests/ and import the pipeline by bare name (`import chatbot`),
# the same way the backend modules import each other; tests/conftest.py puts
# backend/ on sys.path. Running `pytest` from the repo root is the whole
# invocation - no environment variables, no model, no network.
[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # sentence-transformers and torch emit deprecation noise on import that is
    # not this project's to fix, and it buries real warnings from our own code.
    ignore::DeprecationWarning
    ignore::FutureWarning
